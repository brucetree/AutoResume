services:
  nginx:
    image: nginx:alpine
    container_name: autoresume-nginx
    restart: unless-stopped
    mem_limit: 100m
    # Reload nginx every 6h so certs renewed by the certbot container get
    # picked up without a redeploy. nginx only reads cert files at startup /
    # reload; without this loop a renewed cert sits unused on disk and the
    # in-memory one expires (caused the Jun 25 → Jul 9 2026 outage).
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl-certs:/etc/ssl/acme:ro
      - ssl-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: autoresume-certbot
    restart: unless-stopped
    mem_limit: 100m
    volumes:
      - ssl-certs:/etc/ssl/acme
      - ssl-lib:/var/lib/letsencrypt
      - ssl-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --config-dir /etc/ssl/acme; sleep 12h & wait $${!}; done;'"

  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/autoresume-backend:latest
    container_name: autoresume-backend
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "5001"
    env_file:
      - .env.backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/autoresume-frontend:latest
    container_name: autoresume-frontend
    restart: unless-stopped
    mem_limit: 300m
    expose:
      - "3000"
    env_file:
      - .env.frontend
    environment:
      - INTERNAL_API_URL=http://backend:5001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ssl-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ec2-user/autoresume/ssl/certs
  ssl-lib:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ec2-user/autoresume/ssl/lib
  ssl-www:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ec2-user/autoresume/ssl/www
