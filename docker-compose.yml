version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: autoresume-mongo
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: autoresume
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
