upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:5001;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name autoresume.org www.autoresume.org;

    # ACME challenge (SSL certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name autoresume.org www.autoresume.org;

    ssl_certificate /etc/ssl/acme/live/autoresume.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/acme/live/autoresume.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # NextAuth routes (handled by Next.js frontend)
    # Only match NextAuth-specific paths: session, callback, signin, signout, csrf, providers, error
    location ~ ^/api/auth/(session|callback|signin|signout|csrf|providers|error) {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (all /api/ routes including /api/auth/register, /api/auth/login, etc.)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend health check
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend (everything else)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
